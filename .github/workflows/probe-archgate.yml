name: Probe archgate availability

on:
  push:
    branches:
      - probe/archgate-pool

permissions:
  contents: read

jobs:
  pool-linux-arm64-toolchain:
    runs-on: [self-hosted, r3dlex-linux-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Toolchain report
        run: |
          set +e
          {
            echo "hostname=$(hostname)"
            echo "arch=$(uname -m)"
            for t in git python3 make g++ cc tar; do
              echo "$t=$(command -v $t || echo MISSING)"
            done
            echo "archgate=$(command -v archgate || echo MISSING)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck

  pool-ubuntu-latest-toolchain:
    runs-on: [self-hosted, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Toolchain report
        run: |
          set +e
          {
            echo "hostname=$(hostname)"
            echo "arch=$(uname -m)"
            for t in git python3 make g++ cc tar; do
              echo "$t=$(command -v $t || echo MISSING)"
            done
            echo "archgate=$(command -v archgate || echo MISSING)"
            archgate --version 2>&1 | sed 's/^/archgate_version=/'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
