name: CI
on: [push, pull_request]

# Runner policy
# -------------
# Every job in this workflow runs on the org's self-hosted ARM64 fleet
# (r3dlex-runner-3 / r3dlex-runner-4, labels [self-hosted, ubuntu-latest]).
#
# `runs-on: ubuntu-latest` is a BARE STRING and therefore always means
# GitHub-hosted -- it is not a label filter. GitHub-hosted capacity is not a
# dependable base for CI in this organisation: the org's Actions spending
# limit has been exhausted at times, and a hosted job that cannot be
# scheduled dies in ~3 seconds with an empty runner_name and an empty step
# list while still reporting a conclusion. A job with no runner and no steps
# is not evidence that anything was verified, so the signal has to come from
# the fleet.
#
# The `_<job>-self-hosted` probes are the opt-in canary leg: they are skipped
# unless the repository variable SELF_HOSTED_CI_ENABLED is set to 'true' (it is
# currently unset), and the paired `_<job>` job then performs the work itself.
# Both legs therefore run on the same fleet, so the fallback never depends on
# GitHub-hosted capacity.

jobs:
  # ==========================================================================
  # build — compile once on the self-hosted runner, publish an artifact the
  # downstream self-hosted legs reuse. The canonical leg and the opt-in
  # canary both build on the same ARM64 fleet, so the native dependency
  # (better-sqlite3) is resolved for one architecture only.
  # ==========================================================================
  _build-self-hosted:
    name: "build (self-hosted)"
    if: vars.SELF_HOSTED_CI_ENABLED == 'true'
    runs-on: [self-hosted, ubuntu-latest]
    continue-on-error: true
    outputs:
      passed: ${{ steps.mark.outputs.passed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - name: Tar artifact
        run: tar czf ci-artifact.tar.gz --exclude='.git' --exclude='node_modules/.cache' . || true
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifact-self-hosted
          path: ci-artifact.tar.gz
          retention-days: 1
      - id: mark
        if: success()
        run: echo "passed=true" >> "$GITHUB_OUTPUT"

  build:
    needs: _build-self-hosted
    if: always()
    runs-on: [self-hosted, ubuntu-latest]
    steps:
      - name: Route
        run: echo "self-hosted passed=${{ needs._build-self-hosted.outputs.passed }}"
      - uses: actions/checkout@v4
        if: needs._build-self-hosted.outputs.passed != 'true'
      - uses: actions/setup-node@v4
        if: needs._build-self-hosted.outputs.passed != 'true'
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
        if: needs._build-self-hosted.outputs.passed != 'true'
      - run: npm run build
        if: needs._build-self-hosted.outputs.passed != 'true'
      - name: Tar artifact
        if: needs._build-self-hosted.outputs.passed != 'true'
        run: tar czf ci-artifact.tar.gz --exclude='.git' --exclude='node_modules/.cache' . || true
      - name: Upload artifact
        if: needs._build-self-hosted.outputs.passed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifact
          path: ci-artifact.tar.gz
          retention-days: 1

  # ==========================================================================
  # test — typecheck + unit tests + archgate
  # ==========================================================================
  _test-self-hosted:
    name: "test (self-hosted)"
    needs: _build-self-hosted
    if: always() && vars.SELF_HOSTED_CI_ENABLED == 'true' && needs._build-self-hosted.outputs.passed == 'true'
    runs-on: [self-hosted, ubuntu-latest]
    continue-on-error: true
    outputs:
      passed: ${{ steps.mark.outputs.passed }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ci-artifact-self-hosted
          path: .
      - name: Extract artifact
        run: tar xzf ci-artifact.tar.gz && rm ci-artifact.tar.gz
      - run: npm run typecheck
      - run: timeout 120 npm test < /dev/null
      - name: Run archgate check
        # archgate is preinstalled on the r3dlex self-hosted Linux/ARM64
        # runners via scripts/provision-host.sh (Bun's --compile builds
        # a native binary from source; the upstream has no linux/arm64
        # release). The binary is on the runner's PATH (see the runner's
        # .path file), so we call it directly here.
        run: |
          archgate --version
          archgate check
      - id: mark
        if: success()
        run: echo "passed=true" >> "$GITHUB_OUTPUT"

  test:
    needs: [build, _test-self-hosted]
    if: always() && needs.build.result == 'success'
    runs-on: [self-hosted, ubuntu-latest]
    steps:
      - name: Route
        run: echo "self-hosted passed=${{ needs._test-self-hosted.outputs.passed }}"
      - uses: actions/checkout@v4
        if: needs._test-self-hosted.outputs.passed != 'true'
      - uses: actions/setup-node@v4
        if: needs._test-self-hosted.outputs.passed != 'true'
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
        if: needs._test-self-hosted.outputs.passed != 'true'
      - run: npm run build
        if: needs._test-self-hosted.outputs.passed != 'true'
      - run: npm run typecheck
        if: needs._test-self-hosted.outputs.passed != 'true'
      - run: timeout 120 npm test < /dev/null
        if: needs._test-self-hosted.outputs.passed != 'true'
      - name: Run archgate check
        if: needs._test-self-hosted.outputs.passed != 'true'
        # The archgate npm shim has no linux/arm64 release artifact (it
        # hard-rejects the platform), so on the ARM64 fleet it can only run
        # the native binary that provision-host.sh builds from source and
        # installs to ~/.archgate/bin (on the runner's PATH). This mirrors
        # the self-hosted canary leg above.
        run: |
          archgate --version
          archgate check

  # ==========================================================================
  # coverage
  # ==========================================================================
  _coverage-self-hosted:
    name: "coverage (self-hosted)"
    needs: _build-self-hosted
    if: always() && vars.SELF_HOSTED_CI_ENABLED == 'true' && needs._build-self-hosted.outputs.passed == 'true'
    runs-on: [self-hosted, ubuntu-latest]
    timeout-minutes: 15
    continue-on-error: true
    outputs:
      passed: ${{ steps.mark.outputs.passed }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ci-artifact-self-hosted
          path: .
      - name: Extract artifact
        run: tar xzf ci-artifact.tar.gz && rm ci-artifact.tar.gz
      - run: timeout 600 npm run test:coverage < /dev/null
      - id: mark
        if: success()
        run: echo "passed=true" >> "$GITHUB_OUTPUT"

  coverage:
    needs: [build, _coverage-self-hosted]
    if: always() && needs.build.result == 'success'
    runs-on: [self-hosted, ubuntu-latest]
    timeout-minutes: 15
    steps:
      - name: Route
        run: echo "self-hosted passed=${{ needs._coverage-self-hosted.outputs.passed }}"
      - uses: actions/checkout@v4
        if: needs._coverage-self-hosted.outputs.passed != 'true'
      - uses: actions/setup-node@v4
        if: needs._coverage-self-hosted.outputs.passed != 'true'
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
        if: needs._coverage-self-hosted.outputs.passed != 'true'
      - run: npm run build
        if: needs._coverage-self-hosted.outputs.passed != 'true'
      - run: timeout 600 npm run test:coverage < /dev/null
        if: needs._coverage-self-hosted.outputs.passed != 'true'

  # ==========================================================================
  # vscode-omp — build + package the VS Code companion extension
  # ==========================================================================
  _vscode-omp-self-hosted:
    name: "vscode-omp (self-hosted)"
    needs: _build-self-hosted
    if: always() && vars.SELF_HOSTED_CI_ENABLED == 'true' && needs._build-self-hosted.outputs.passed == 'true'
    runs-on: [self-hosted, ubuntu-latest]
    continue-on-error: true
    outputs:
      passed: ${{ steps.mark.outputs.passed }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ci-artifact-self-hosted
          path: .
      - name: Extract artifact
        run: tar xzf ci-artifact.tar.gz && rm ci-artifact.tar.gz
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: vscode-omp/package-lock.json
      - name: Install extension dependencies
        run: cd vscode-omp && npm ci
      - name: Build extension
        run: cd vscode-omp && npm run build --if-present
      - name: Test extension
        run: cd vscode-omp && npm test --if-present
      - name: Package VSIX
        run: cd vscode-omp && npm run package --if-present
      - name: Upload VSIX artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vscode-omp-artifacts-self-hosted
          path: |
            vscode-omp/*.vsix
            vscode-omp/dist/**
            vscode-omp/out/**
          if-no-files-found: ignore
      - id: mark
        if: success()
        run: echo "passed=true" >> "$GITHUB_OUTPUT"

  vscode-omp:
    needs: [build, _vscode-omp-self-hosted]
    if: always() && needs.build.result == 'success'
    runs-on: [self-hosted, ubuntu-latest]
    steps:
      - name: Route
        run: echo "self-hosted passed=${{ needs._vscode-omp-self-hosted.outputs.passed }}"
      - uses: actions/checkout@v4
        if: needs._vscode-omp-self-hosted.outputs.passed != 'true'
      - uses: actions/setup-node@v4
        if: needs._vscode-omp-self-hosted.outputs.passed != 'true'
        with:
          node-version: "22"
          cache: "npm"
      - name: Install root dependencies
        if: needs._vscode-omp-self-hosted.outputs.passed != 'true'
        run: npm ci
      - name: Build root project
        if: needs._vscode-omp-self-hosted.outputs.passed != 'true'
        run: npm run build
      - name: Install extension dependencies
        if: needs._vscode-omp-self-hosted.outputs.passed != 'true'
        run: cd vscode-omp && npm ci
      - name: Build extension
        if: needs._vscode-omp-self-hosted.outputs.passed != 'true'
        run: cd vscode-omp && npm run build --if-present
      - name: Test extension
        if: needs._vscode-omp-self-hosted.outputs.passed != 'true'
        run: cd vscode-omp && npm test --if-present
      - name: Package VSIX
        if: needs._vscode-omp-self-hosted.outputs.passed != 'true'
        run: cd vscode-omp && npm run package --if-present
      - name: Upload VSIX artifacts
        if: always() && needs._vscode-omp-self-hosted.outputs.passed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vscode-omp-artifacts
          path: |
            vscode-omp/*.vsix
            vscode-omp/dist/**
            vscode-omp/out/**
          if-no-files-found: ignore
