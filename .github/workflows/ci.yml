name: CI
on: [push, pull_request]

# These jobs only need to READ the repository. Without an explicit block they
# inherit the repository's default GITHUB_TOKEN scope, and that token is
# materialised in a shared runner's job environment.
permissions:
  contents: read

# The pinned archgate version. The gate script refuses to run without it:
# `archgate --version` only prints, so nothing else would notice a rebuilt
# or drifted binary changing what CI enforces.
env:
  EXPECTED_ARCHGATE_VERSION: "0.60.0"

# Runner policy
# -------------
# Every job in this workflow runs on the org's self-hosted ARM64 fleet
# (labels [self-hosted, ubuntu-latest] -> r3dlex-runner-3 / r3dlex-runner-4).
#
# `runs-on: ubuntu-latest` is a BARE STRING and therefore always means
# GitHub-hosted -- it is not a label filter. GitHub-hosted capacity is not a
# dependable base for CI in this organisation: the org's Actions spending
# limit has been exhausted at times, and a hosted job that cannot be
# scheduled dies in ~3 seconds with an empty runner_name and an empty step
# list while still reporting a conclusion. A job with no runner and no steps
# is not evidence that anything was verified, so the signal has to come from
# the fleet.
#
# A `runs-on` ARRAY is a pure AND over labels, so the array below names the
# label set the fleet actually carries. The macOS runners are labelled
# `self-hosted, ARM64, macOS, r3dlex-org` with no `Linux` label and the
# Linux x64 runners carry `X64` rather than `ARM64`, so neither can match.
#
# The pool is deliberately NOT widened to [self-hosted, Linux, ARM64], even
# though that would also match r3dlex-linux-arm64-1..4 (six runners instead
# of two). A probe run against the wider label set showed those runners
# carry no CI toolchain at all -- no node, no npm, no bun, no archgate
# (`command -v archgate` -> not found). Upstream publishes no linux/arm64
# archgate release asset, so the binary has to be built from source on the
# host by scripts/provision-host.sh; a runner without it cannot run the ADR
# gate at all. Widening the pool would trade a working gate for capacity.
#
# The `_<job>-self-hosted` probes are the opt-in canary leg, and they are
# DORMANT: SELF_HOSTED_CI_ENABLED is unset at BOTH repository and org scope
# (verified against the Actions variables API), so
# `vars.SELF_HOSTED_CI_ENABLED == 'true'` is false and every canary job is
# skipped. Turning the canary on means CREATING that variable, which is a
# host-policy decision -- it changes what every repo in the org schedules --
# and is deliberately not made from this workflow. Until it exists, the
# paired `_<job>` job performs the work itself, on the same fleet the canary
# would use, so the fallback never depends on GitHub-hosted capacity.

jobs:
  # ==========================================================================
  # build — compile once on the self-hosted runner, publish an artifact the
  # downstream self-hosted legs reuse. The canonical leg and the opt-in
  # canary both build on the same ARM64 fleet, so the native dependency
  # (better-sqlite3) is resolved for one architecture only.
  # ==========================================================================
  _build-self-hosted:
    name: "build (self-hosted)"
    if: vars.SELF_HOSTED_CI_ENABLED == 'true'
    runs-on: [self-hosted, ubuntu-latest]
    continue-on-error: true
    outputs:
      passed: ${{ steps.mark.outputs.passed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - name: Tar artifact
        run: tar czf ci-artifact.tar.gz --exclude='.git' --exclude='node_modules/.cache' . || true
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-artifact-self-hosted
          path: ci-artifact.tar.gz
          retention-days: 1
      - id: mark
        if: success()
        run: echo "passed=true" >> "$GITHUB_OUTPUT"

  build:
    needs: _build-self-hosted
    if: always()
    runs-on: [self-hosted, ubuntu-latest]
    steps:
      - name: Route
        run: echo "self-hosted passed=${{ needs._build-self-hosted.outputs.passed }}"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: needs._build-self-hosted.outputs.passed != 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: needs._build-self-hosted.outputs.passed != 'true'
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
        if: needs._build-self-hosted.outputs.passed != 'true'
      - run: npm run build
        if: needs._build-self-hosted.outputs.passed != 'true'

  # ==========================================================================
  # test — typecheck + unit tests + archgate
  # ==========================================================================
  _test-self-hosted:
    name: "test (self-hosted)"
    needs: _build-self-hosted
    if: always() && vars.SELF_HOSTED_CI_ENABLED == 'true' && needs._build-self-hosted.outputs.passed == 'true'
    runs-on: [self-hosted, ubuntu-latest]
    continue-on-error: true
    outputs:
      passed: ${{ steps.mark.outputs.passed }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Download artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ci-artifact-self-hosted
          path: .
      - name: Extract artifact
        run: tar xzf ci-artifact.tar.gz && rm ci-artifact.tar.gz
      - run: npm run typecheck
      - run: timeout 120 npm test < /dev/null
      - name: Run archgate check
        # archgate is preinstalled on the r3dlex self-hosted Linux/ARM64
        # runners via scripts/provision-host.sh (Bun's --compile builds a
        # native binary from source; upstream publishes no linux/arm64
        # release asset). The binary is on the runner's PATH (see the
        # runner's .path file), so we call it directly here.
        #
        # We do NOT use `npx archgate`: the npm shim resolves the CACHED
        # ~/.archgate/bin/archgate first, so `npx archgate --version` reports
        # the cached binary's version rather than the version in
        # package.json — the repository's pin was never enforced. The
        # gate script asserts EXPECTED_ARCHGATE_VERSION instead, repo-side.
        #
        # `archgate check` also exits 0 when it checked NOTHING (every ADR
        # declared `rules: false` and no companion .rules.ts existed), so
        # the gate script asserts the report's rule count too: a gate that
        # checks zero rules fails instead of passing.
        run: scripts/archgate-gate.sh
      - id: mark
        if: success()
        run: echo "passed=true" >> "$GITHUB_OUTPUT"

  test:
    needs: [build, _test-self-hosted]
    if: always() && needs.build.result == 'success'
    runs-on: [self-hosted, ubuntu-latest]
    steps:
      - name: Route
        run: echo "self-hosted passed=${{ needs._test-self-hosted.outputs.passed }}"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: needs._test-self-hosted.outputs.passed != 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: needs._test-self-hosted.outputs.passed != 'true'
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
        if: needs._test-self-hosted.outputs.passed != 'true'
      - run: npm run build
        if: needs._test-self-hosted.outputs.passed != 'true'
      - run: npm run typecheck
        if: needs._test-self-hosted.outputs.passed != 'true'
      - run: timeout 120 npm test < /dev/null
        if: needs._test-self-hosted.outputs.passed != 'true'
      - name: Run archgate check
        if: needs._test-self-hosted.outputs.passed != 'true'
        # See the canary leg above for why the binary is called directly and
        # why both the version and the rule count are asserted.
        run: scripts/archgate-gate.sh

  # ==========================================================================
  # coverage
  # ==========================================================================
  _coverage-self-hosted:
    name: "coverage (self-hosted)"
    needs: _build-self-hosted
    if: always() && vars.SELF_HOSTED_CI_ENABLED == 'true' && needs._build-self-hosted.outputs.passed == 'true'
    runs-on: [self-hosted, ubuntu-latest]
    timeout-minutes: 15
    continue-on-error: true
    outputs:
      passed: ${{ steps.mark.outputs.passed }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Download artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ci-artifact-self-hosted
          path: .
      - name: Extract artifact
        run: tar xzf ci-artifact.tar.gz && rm ci-artifact.tar.gz
      - run: timeout 600 npm run test:coverage < /dev/null
      - id: mark
        if: success()
        run: echo "passed=true" >> "$GITHUB_OUTPUT"

  coverage:
    needs: [build, _coverage-self-hosted]
    if: always() && needs.build.result == 'success'
    runs-on: [self-hosted, ubuntu-latest]
    timeout-minutes: 15
    steps:
      - name: Route
        run: echo "self-hosted passed=${{ needs._coverage-self-hosted.outputs.passed }}"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: needs._coverage-self-hosted.outputs.passed != 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: needs._coverage-self-hosted.outputs.passed != 'true'
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
        if: needs._coverage-self-hosted.outputs.passed != 'true'
      - run: npm run build
        if: needs._coverage-self-hosted.outputs.passed != 'true'
      - run: timeout 600 npm run test:coverage < /dev/null
        if: needs._coverage-self-hosted.outputs.passed != 'true'

  # ==========================================================================
  # vscode-omp — build + package the VS Code companion extension
  # ==========================================================================
  _vscode-omp-self-hosted:
    name: "vscode-omp (self-hosted)"
    needs: _build-self-hosted
    if: always() && vars.SELF_HOSTED_CI_ENABLED == 'true' && needs._build-self-hosted.outputs.passed == 'true'
    runs-on: [self-hosted, ubuntu-latest]
    continue-on-error: true
    outputs:
      passed: ${{ steps.mark.outputs.passed }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ci-artifact-self-hosted
          path: .
      - name: Extract artifact
        run: tar xzf ci-artifact.tar.gz && rm ci-artifact.tar.gz
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: vscode-omp/package-lock.json
      - name: Install extension dependencies
        run: cd vscode-omp && npm ci
      - name: Build extension
        run: cd vscode-omp && npm run build --if-present
      - name: Test extension
        run: cd vscode-omp && npm test --if-present
      - name: Package VSIX
        run: cd vscode-omp && npm run package --if-present
      - name: Upload VSIX artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vscode-omp-artifacts-self-hosted
          path: |
            vscode-omp/*.vsix
            vscode-omp/dist/**
            vscode-omp/out/**
          if-no-files-found: ignore
      - id: mark
        if: success()
        run: echo "passed=true" >> "$GITHUB_OUTPUT"

  vscode-omp:
    needs: [build, _vscode-omp-self-hosted]
    if: always() && needs.build.result == 'success'
    runs-on: [self-hosted, ubuntu-latest]
    steps:
      - name: Route
        run: echo "self-hosted passed=${{ needs._vscode-omp-self-hosted.outputs.passed }}"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: needs._vscode-omp-self-hosted.outputs.passed != 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: needs._vscode-omp-self-hosted.outputs.passed != 'true'
        with:
          node-version: "22"
          cache: "npm"
      - name: Install root dependencies
        if: needs._vscode-omp-self-hosted.outputs.passed != 'true'
        run: npm ci
      - name: Build root project
        if: needs._vscode-omp-self-hosted.outputs.passed != 'true'
        run: npm run build
      - name: Install extension dependencies
        if: needs._vscode-omp-self-hosted.outputs.passed != 'true'
        run: cd vscode-omp && npm ci
      - name: Build extension
        if: needs._vscode-omp-self-hosted.outputs.passed != 'true'
        run: cd vscode-omp && npm run build --if-present
      - name: Test extension
        if: needs._vscode-omp-self-hosted.outputs.passed != 'true'
        run: cd vscode-omp && npm test --if-present
      - name: Package VSIX
        if: needs._vscode-omp-self-hosted.outputs.passed != 'true'
        run: cd vscode-omp && npm run package --if-present
      - name: Upload VSIX artifacts
        if: always() && needs._vscode-omp-self-hosted.outputs.passed != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vscode-omp-artifacts
          path: |
            vscode-omp/*.vsix
            vscode-omp/dist/**
            vscode-omp/out/**
          if-no-files-found: ignore
