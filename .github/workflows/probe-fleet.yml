name: Probe Fleet

# TEMPORARY probe: gathers evidence about the ARM64 runners that do NOT carry
# the `ubuntu-latest` label, so the CI label set can be widened on evidence
# rather than on assumption. Deleted in the follow-up commit.

on:
  pull_request:
    paths:
      - ".github/workflows/probe-fleet.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Linux, ARM64, r3dlex-linux-arm64]
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4]
    steps:
      - name: Report toolchain
        run: |
          {
            echo "hostname=$(hostname)"
            echo "arch=$(uname -m)"
            echo "archgate_path=$(command -v archgate || echo MISSING)"
            echo "archgate_version=$(archgate --version 2>&1 || echo FAILED)"
            echo "node=$(node --version 2>&1 || echo MISSING)"
            echo "npm=$(npm --version 2>&1 || echo MISSING)"
            echo "git=$(git --version 2>&1 || echo MISSING)"
            echo "python3=$(python3 --version 2>&1 || echo MISSING)"
            echo "archgate_bin_exists=$([ -x "$HOME/.archgate/bin/archgate" ] && echo yes || echo no)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
